<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>F.E.A.R. Online</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: radial-gradient(ellipse at center, #1a0a0a 0%, #050505 70%);
        color: #d8d8da;
        font-family: "Consolas", "Segoe UI", monospace;
        overflow: hidden;
    }
    .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        text-align: center;
    }
    h1 {
        font-size: 42px;
        letter-spacing: 10px;
        margin: 0;
        color: #eaeaea;
        text-shadow: 0 0 18px rgba(192, 57, 43, 0.55);
    }
    h1 span {
        color: #c0392b;
    }
    .news {
        margin-top: 60px;
        width: 70%;
        border-top: 1px solid #3a1414;
        padding-top: 18px;
        font-size: 12px;
        color: #8a8a8d;
        letter-spacing: 1px;
    }
</style>
</head>
<body>
    <div class="wrap">
        <h1>F.E.A.R<span>.</span> ONLINE</h1>
        <div class="news">
            The game is not guaranteed to work on your computer.<br>
            The Launcher application is not guaranteed to work during the development stage.
        </div>
    </div>
</body>
</html>
